# application-secret.properties (NUNCA subir a GitHub)
# Valores por defecto para desarrollo local; en Render se deben sobreescribir con variables de entorno.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
biskit.mail.from=${BISKIT_MAIL_FROM:${spring.mail.username:}}
biskit.frontend.base-url=${BISKIT_FRONTEND_BASE_URL:https://biskit.website}