# Configuracion de correo con Resend. En Render se sobreescribe con variables de entorno.
resend.api-key=${RESEND_API_KEY:}
resend.emails-url=${RESEND_EMAILS_URL:https://api.resend.com/emails}

biskit.mail.from=${BISKIT_MAIL_FROM:${RESEND_FROM_EMAIL:}}
biskit.frontend.base-url=${BISKIT_FRONTEND_BASE_URL:https://biskit.website}
logging.level.org.springframework.web.client.RestClient=INFO