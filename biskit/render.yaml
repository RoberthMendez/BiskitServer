services:
  - type: web
    name: biskit
    env: docker
    rootDir: biskit
    dockerfilePath: biskit/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        value: veterinariabiskit@gmail.com
      - key: BISKIT_FRONTEND_BASE_URL
        value: https://biskit.website
      - key: BISKIT_MAIL_FROM
        value: veterinariabiskit@gmail.com
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1151865241345341"
      - key: WHATSAPP_API_URL
        value: https://graph.facebook.com/v25.0/1151865241345341/messages
